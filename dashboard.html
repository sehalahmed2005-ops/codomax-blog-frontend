<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <title>Dashboard – Inkwell</title>
</head>
<body>
  <header class="site" id="site-header"></header>

  <main>
    <div class="row">
      <div>
        <h1 id="hi" style="font-size:2rem"></h1>
      </div>
      <a class="btn" href="create-blog.html">Write a post</a>
    </div>

    <div class="stats">
      <div class="stat"><b id="n-mine">0</b>Your posts</div>
      <div class="stat"><b id="n-all">0</b>All posts</div>
    </div>

    <h2>Your posts</h2>
    <div class="grid" id="mine"></div>
    <dialog id="post-dialog"></dialog>
  </main>

  <footer>Inkwell · Codomax Frontend Internship Project</footer>

    <script src="app.js"></script>
  <script>
    Auth.require();
    const u = Auth.user();
    if (u) document.getElementById('hi').textContent = 'Welcome, ' + u.name;

    async function draw() {
      const all = await Posts.all();
      const mine = all.filter(p => p.authorId === u.id);
      document.getElementById('n-mine').textContent = mine.length;
      document.getElementById('n-all').textContent = all.length;
      document.getElementById('mine').innerHTML = mine.length
        ? mine.map(p => postCard(p, true)).join('')
        : '<div class="empty">You have not published anything yet. <a href="create-blog.html">Write your first post</a>.</div>';
    }
    if (u) draw();

    document.getElementById('mine').addEventListener('click', async e => {
      if (e.target.dataset.read) openPost(e.target.dataset.read);
      if (e.target.dataset.del && confirm('Delete this post?')) {
        const err = await Posts.remove(e.target.dataset.del);
        if (err) return toast(err);
        await draw();
        toast('Post deleted');
      }
    });
  </script>
</body>
</html>
